    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-header border-0">
          <h5 class="modal-title" id="loginModalLabel">Mensaje</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>

        <div class="modal-body" id="loginModalMessage">

  <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel"
  aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="changePasswordModalLabel">Cambiar Contraseña</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
              <form id="changePasswordForm">
                <div class="mb-3">
                    <label for="mail" class="form-label">Correo</label>
                    <input type="mail" class="form-control" id="mail" required>
                </div>
                  <div class="mb-3">
                      <label for="oldPassword" class="form-label">Contraseña Anterior</label>
                      <input type="password" class="form-control" id="oldPassword" required>
                  </div>
                  <div class="mb-3">
                      <label for="newPassword" class="form-label">Nueva Contraseña</label>
                      <input type="password" class="form-control" id="newPassword" required>
                  </div>
                  <div class="mb-3">
                      <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                      <input type="password" class="form-control" id="confirmPassword" required>
                  </div>
                  <div id="error-message" class="text-danger" style="display: none;">
                      Las contraseñas no coinciden o la contraseña anterior es incorrecta.
                  </div>
                  <button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
              </form>
          </div>
      </div>
  </div>
